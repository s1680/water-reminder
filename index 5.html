<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💧 喝水提醒器 - SXH Studio</title>
<style>
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:Arial,sans-serif;background:linear-gradient(135deg,#74ebd5,#9face6);overflow:hidden}
.watermark{position:fixed;font-size:120px;font-weight:900;letter-spacing:5px;color:rgba(0,0,0,.08);transform:rotate(-25deg);z-index:0;pointer-events:none}
.card{position:relative;z-index:1;width:300px;padding:30px;text-align:center;background:#fff;border-radius:25px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.water{font-size:65px}h1{color:#2196f3}
select{width:100%;padding:12px;border-radius:12px}
button{padding:12px 25px;margin:15px 5px;border:0;border-radius:20px;font-size:16px}
.start{background:#4caf50;color:white}.pause{background:#eee}
#countdown{font-size:30px;font-weight:bold}.creator{font-size:12px;color:#999}
</style>
</head>
<body>
<div class="watermark">SXH Studio</div>
<div class="card">
<div class="water">💧</div>
<h1>喝水提醒器</h1>
<p>选择提醒间隔</p>
<select id="minutes">
<option value="1">1 分钟</option>
<option value="5">5 分钟</option>
<option value="15">15 分钟</option>
<option value="30">30 分钟</option>
<option value="60">60 分钟</option>
</select>
<div id="countdown">等待开始</div>
<button class="start" onclick="startTimer()">▶ 开始</button>
<button class="pause" onclick="pauseTimer()">⏸ 暂停</button>
<p class="creator">Created by SXH Studio</p>
</div>
<script>
let timer,secondsLeft=0;
function startTimer(){
clearInterval(timer);
let minutes=Number(document.getElementById("minutes").value);
secondsLeft=minutes*60;
updateDisplay();
timer=setInterval(()=>{secondsLeft--;updateDisplay();if(secondsLeft<=0){alert("💧 该喝水啦！");secondsLeft=minutes*60}},1000);
}
function pauseTimer(){clearInterval(timer);document.getElementById("countdown").innerHTML="已暂停";}
function updateDisplay(){document.getElementById("countdown").innerHTML="下次提醒："+Math.floor(secondsLeft/60)+"分 "+secondsLeft%60+"秒";}
</script>
</body>
</html>
