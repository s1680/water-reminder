<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💧 喝水提醒器</title>
<style>
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:Arial,sans-serif;background:linear-gradient(135deg,#74ebd5,#9face6)}
.card{width:300px;padding:30px;text-align:center;background:white;border-radius:25px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.water{font-size:65px}h1{color:#2196f3}
select{width:100%;padding:12px;border-radius:12px;border:1px solid #ddd;font-size:16px}
button{padding:12px 25px;margin:15px 5px;border:none;border-radius:20px;font-size:16px}
.start{background:#4caf50;color:white}.pause{background:#eee}
#countdown{font-size:30px;font-weight:bold}
</style>
</head>
<body>
<div class="card">
<div class="water">💧</div>
<h1>喝水提醒器</h1>
<p>选择提醒间隔</p>
<select id="minutes">
<option value="1">1 分钟</option>
<option value="5">5 分钟</option>
<option value="15">15 分钟</option>
<option value="30">30 分钟</option>
<option value="60">60 分钟</option>
</select>
<div id="countdown">等待开始</div>
<button class="start" onclick="startTimer()">▶ 开始</button>
<button class="pause" onclick="pauseTimer()">⏸ 暂停</button>
</div>
<script>
let timer;
let secondsLeft=0;
function startTimer(){
 clearInterval(timer);
 let minutes=Number(document.getElementById("minutes").value);
 secondsLeft=minutes*60;
 updateDisplay();
 timer=setInterval(function(){
   secondsLeft--;
   updateDisplay();
   if(secondsLeft<=0){
     alert("💧 该喝水啦！");
     secondsLeft=minutes*60;
   }
 },1000);
}
function pauseTimer(){
 clearInterval(timer);
 document.getElementById("countdown").innerHTML="已暂停";
}
function updateDisplay(){
 let minutes=Math.floor(secondsLeft/60);
 let seconds=secondsLeft%60;
 document.getElementById("countdown").innerHTML=
 "下次提醒："+minutes+"分 "+seconds+"秒";
}
</script>
</body>
</html>
